[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyguide-devkit"
version = "0.1.0"
description = "Scaffolding, schema validation, and authoring toolkit for CyGuide tool adapters"
readme = "README.md"
authors = [{ name = "CyGuide Team" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cyguide-devkit = "cyguide_devkit.cli:main"
cydevkit = "cyguide_devkit.cli:main"
adapter-authoring = "cyguide_devkit.cli:main"
cyguide-adapter-authoring = "cyguide_devkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
